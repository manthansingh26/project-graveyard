          <h1 style="font-size: 1.75rem; font-weight: 800; color: #1F2A24; margin: 0 0 0.5rem 0; text-align: center; letter-spacing: -0.02em;">
            The Project Graveyard
          </h1>
          <p style="font-size: 1rem; color: #8A6414; font-style: italic; margin: 0 0 1.5rem 0; text-align: center;">
            Where good projects rest — until they rise again.
          </p>

          <p style="font-size: 0.9375rem; color: #4D5E53; line-height: 1.6; margin: 0 0 1rem 0;">
            The Project Graveyard is a digital afterlife and revival sanctuary for unfinished software. It provides builders with a respectful place to:
          </p>

          <ul style="font-size: 0.875rem; color: #1F2A24; line-height: 1.7; margin: 0 0 1.5rem 0; padding-left: 1.25rem;">
            <li><strong>Record abandoned projects:</strong> Perform an honest autopsy documenting original visions, completed features, and the real reasons work paused.</li>
            <li><strong>Review project history:</strong> Maintain an archive log of past code and milestones so valuable ideas and lessons are never forgotten.</li>
            <li><strong>Assess revival potential:</strong> Compute an objective Resurrection Score balancing idea strength, build completeness, and dormancy bonus.</li>
            <li><strong>Create a revival plan:</strong> Transform unfinished milestones into an actionable checklist to bring stalled builds back to life.</li>
            <li><strong>Offer eligible projects for adoption:</strong> Open graves to the developer community so new builders can take stewardship and carry the vision forward.</li>
          </ul>

          <div style="background: #F3EEE2; border: 1px solid #E5DECD; border-radius: 12px; padding: 1rem 1.25rem; text-align: center;">
            <p style="font-size: 0.875rem; color: #4D5E53; margin: 0; line-height: 1.5;">
              <strong>Interactive features notice:</strong> This application runs entirely in your browser using local storage with zero cloud tracking. JavaScript is required to record autopsies, calculate live scores, manage interactive revival plans, and export data.
            </p>
